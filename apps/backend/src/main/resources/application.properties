spring.application.name=back-travel-blog
spring.config.import=optional:file:env.properties
# db config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# hibernate
spring.jpa.hibernate.ddl-auto=update
# secret
jwt.secret=${JWT_SECRET}
#Cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api.secret=${CLOUDINARY_SECRET}
cloudinary.api.key=${CLOUDINARY_APIKEY}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.data.web.pageable.serialization-mode=via_dto
# User/Admin
admin.password=${ADMIN_PASSWORD}
admin.email=${ADMIN_EMAIL}
# Cookies
auth.cookie.name=${AUTH_COOKIE_NAME:session}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.max-age=43200
frontend.url=${FRONTEND_URL:http://localhost:5173}
