services:
  postgres:
    image: postgres:18.6
    restart: "no"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: btb
    ports:
      - "5432:5432"
    volumes:
      - "postgres:/var/lib/postgresql:rw"
      - ./local/postgres:/dumps
volumes:
  postgres: